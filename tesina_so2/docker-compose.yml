version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: so2_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: so2_monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - so2_network

  # RabbitMQ - Message Bus
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: so2_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - so2_network

  # API REST
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: so2_api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=so2_monitoring
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - so2_network

  worker_calculos:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: so2_worker_calculos
    command: python -m message_bus.message_bus calculos
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=so2_monitoring
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - CDS_API_KEY=${CDS_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./.cdsapirc:/root/.cdsapirc:ro
      - ./calculador:/app/calculador
      - ./etl:/app/etl
      - ./data:/app/data
      - ./.cdsapirc:/root/.cdsapirc:ro
    networks:
      - so2_network

  # Worker de Extracción
  worker_extraccion:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: so2_worker_extraccion
    command: python -m message_bus.message_bus extraccion
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=so2_monitoring
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - COPERNICUS_USERNAME=${COPERNICUS_USERNAME}
      - COPERNICUS_PASSWORD=${COPERNICUS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - so2_network

  # Frontend (servidor estático)
  frontend:
    image: nginx:alpine
    container_name: so2_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - so2_network

  # Jupyter Notebook
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: so2_jupyter
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=so2_monitoring
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./data:/home/jovyan/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - so2_network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  so2_network:
    driver: bridge
