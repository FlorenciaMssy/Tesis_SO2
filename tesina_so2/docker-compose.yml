version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: so2_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: so2_monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - so2_network

  # API REST
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: so2_api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=so2_monitoring
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      # Credenciales de Google Earth Engine
      - C:/Users/julia/.config/earthengine:/root/.config/earthengine:ro
       # Credenciales de ERA5/Copernicus
      - ./.cdsapirc:/root/.cdsapirc:ro
    networks:
      - so2_network

  # Frontend (servidor estático)
  frontend:
    image: nginx:alpine
    container_name: so2_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - so2_network

  # Jupyter Notebook
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: so2_jupyter
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=so2_monitoring
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./data:/home/jovyan/data
      # Credenciales de Google Earth Engine
      - C:/Users/julia/.config/earthengine:/root/.config/earthengine:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - so2_network

volumes:
  postgres_data:

networks:
  so2_network:
    driver: bridge